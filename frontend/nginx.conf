server {
    listen 80;
    server_name ontimenyc.duckdns.org localhost;

    # If any traffic blindly hits standard port 80, automatically force upgrade it safely to encrypted 443!
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Establish universally recognized standard secure protocols natively locking to port 443
    listen 443 ssl;
    server_name ontimenyc.duckdns.org;

    # Map the SSL Security strings correctly where we dynamically mounted the Ubuntu core paths!
    ssl_certificate /etc/letsencrypt/live/ontimenyc.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ontimenyc.duckdns.org/privkey.pem;

    # Disable old vulnerable encryption schemas proactively 
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Serve static React built files natively
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Crucial for routing: fall back to index.html mimicking the SPA standard
        try_files $uri $uri/ /index.html;
    }

    # Intercept API calls avoiding CORS locally and proxy straight to Python backend array securely!
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
